<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="login">
        <h1 class="login__title">Create your account</h1>
        <p class="login__intro">It only takes a minute.</p>

        <!--ERROR-->

        <form class="login__form" action="/register" method="post">
            <div class="field">
                <label for="forename">Forename</label>
                <input type="text" name="forename" id="forename" autocomplete="given-name" autofocus required>
            </div>

            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" id="surname" autocomplete="family-name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" autocomplete="new-password" minlength="8" required>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" name="confirmPassword" id="confirmPassword" autocomplete="new-password"
                    minlength="8" required>
            </div>

            <button type="submit" class="btn btn--primary">Create account</button>
        </form>

        <p class="login__switch">Already have an account? <a href="login.html">Log in</a></p>
    </main>
</body>

</html>
